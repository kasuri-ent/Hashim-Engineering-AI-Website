<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft photorealistic drop shadows matching HE Logo Transparent 3 -->
    <filter id="logoShadowDark" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="3" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.38" />
    </filter>
    <filter id="logoTextShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <g id="monogram-group" transform="translate(30, 20)">
    <!-- Letter E in the background with soft drop shadow -->
    <g filter="url(#logoShadowDark)" opacity="0.96">
      <!-- E Vertical Stem & Arms -->
      <path
        d="M258 132 H352 V160 H342 L340 144 H282 V208 H332 V222 H282 V286 H350 L352 270 H362 V298 H258 Z"
        fill="#FFFFFF"
      />
    </g>

    <!-- Letter H in the foreground (Rich Crimson Red #BA1515) with soft drop shadow -->
    <g filter="url(#logoShadowDark)">
      <!-- Left Stem with Top Bracketed Serif and Bottom Sweeping Calligraphic Tail -->
      <path
        d="M120 92 H190 V97 C178 98 172 104 172 114 V210 H138 V114 C138 104 132 98 120 97 Z"
        fill="#BA1515"
      />
      
      <!-- Left Lower Stem Sweeping to the Left and Downward to a Fine Point -->
      <path
        d="M138 210 H172 V226 C172 278 164 326 138 354 C126 367 113 372 102 374 C114 366 126 352 131 336 C137 315 138 280 138 226 Z"
        fill="#BA1515"
      />

      <!-- Horizontal Crossbar -->
      <rect x="171" y="210" width="114" height="12" fill="#BA1515" />

      <!-- Right Stem with Classical Base Serif and Upper Graceful Arching Scythe/Horn Flourish -->
      <!-- Base Serif at Bottom -->
      <path
        d="M254 336 H324 V331 C314 330 306 324 306 312 V222 H284 V312 C284 324 276 330 254 331 Z"
        fill="#BA1515"
      />

      <!-- Right Upper Pillar Arching into Outward Scythe Tip -->
      <path
        d="M284 222 V186 C284 132 298 78 336 48 C318 90 306 142 306 186 V222 Z"
        fill="#BA1515"
      />
    </g>

    <!-- Brand Typography Centered Below Monogram -->
    <!-- "HASHIM" in White with Drop Shadow -->
    <text
      x="220"
      y="418"
      text-anchor="middle"
      fill="#FFFFFF"
      filter="url(#logoTextShadow)"
      font-family="'Times New Roman', 'Playfair Display', serif"
      font-size="34"
      font-weight="bold"
      letter-spacing="3"
    >
      HASHIM
    </text>

    <!-- "ENGINEERING" in Medium Gray Sans-Serif with Tracking -->
    <text
      x="220"
      y="442"
      text-anchor="middle"
      fill="#64748B"
      font-family="'Plus Jakarta Sans', 'Inter', sans-serif"
      font-size="14.5"
      font-weight="600"
      letter-spacing="5"
    >
      ENGINEERING
    </text>
  </g>
</svg>
